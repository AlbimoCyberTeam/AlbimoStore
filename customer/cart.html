<!-- customer/cart.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - AlbimoStore-Pro</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <h2>Keranjang Belanja Anda</h2>
    <div id="cartList">Keranjang Anda kosong.</div>
    <hr>
    <h3>Total: <span id="cartTotal">Rp 0</span></h3>
    <!-- Cari bagian tag ini di customer/cart.html dan ganti parameternya -->
<button id="btnCheckout" onclick="window.location.href='checkout.html'" disabled>Lanjutkan ke Pembayaran</button>

    <script type="module">
        import { protectPage } from "../assets/js/auth-guard.js";
        
        // Kunci halaman khusus untuk Customer
        protectPage(["customer"]);

        function displayCart() {
            // Ambil data dari localStorage
            const cart = JSON.parse(localStorage.getItem("albimo_cart")) || [];
            const listContainer = document.getElementById("cartList");
            const totalContainer = document.getElementById("cartTotal");
            const btnCheckout = document.getElementById("btnCheckout");

            if (cart.length === 0) {
                listContainer.innerHTML = "<p>Keranjang Anda kosong.</p>";
                totalContainer.innerText = "Rp 0";
                btnCheckout.disabled = true;
                return;
            }

            listContainer.innerHTML = "";
            let grandTotal = 0;

            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                grandTotal += subtotal;

                const row = document.createElement("div");
                row.style.margin = "10px 0";
                row.innerHTML = `
                    <strong>${item.name}</strong> - Rp ${item.price.toLocaleString('id-ID')} 
                    x ${item.quantity} = Rp ${subtotal.toLocaleString('id-ID')}
                    <button onclick="removeFromCart(${index})">Hapus</button>
                `;
                listContainer.appendChild(row);
            });

            totalContainer.innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
            btnCheckout.disabled = false;
        }

        // Fungsi hapus item dari keranjang
        window.removeFromCart = (index) => {
            let cart = JSON.parse(localStorage.getItem("albimo_cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("albimo_cart", JSON.stringify(cart));
            displayCart();
        };

        // Jalankan tampilan keranjang saat halaman dimuat
        displayCart();

<!-- Taruh skrip ini di bagian paling bawah sebelum tag </body> -->
<script type="module">
    import { initNavbar } from "../assets/js/navbar.js";
    // Berikan nilai true karena file ini berada di dalam subfolder
    initNavbar(true);
</script>
</body>
</html>
