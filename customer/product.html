<!-- product.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - AlbimoStore-Pro</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .detail-container {
            display: flex;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .detail-image img {
            max-width: 100%;
            width: 400px;
            border-radius: 8px;
        }

        .detail-info {
            max-width: 600px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-group button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        #btnAddToCart {
            background: #28a745;
        }

        #btnAddToWishlist {
            background: #64748b;
        }
    </style>
</head>
<body>
    <header style="padding:15px;">
        <a href="../index.html">← Kembali ke Katalog</a>
    </header>

    <div class="detail-container" id="productDetail">
        <p>Memuat detail produk...</p>
    </div>

    <script type="module">
        import { db, auth } from "../firebase/config.js";
        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        let currentProduct = null;

        async function loadProductDetail() {
            const container = document.getElementById("productDetail");

            if (!productId) {
                container.innerHTML = "<p>Produk tidak ditemukan.</p>";
                return;
            }

            try {
                const docRef = doc(db, "products", productId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = "<p>Produk tidak ditemukan di database.</p>";
                    return;
                }

                currentProduct = {
                    id: docSnap.id,
                    ...docSnap.data()
                };

                container.innerHTML = `
                    <div class="detail-image">
                        <img src="${currentProduct.imageUrl}" alt="${currentProduct.name}">
                    </div>

                    <div class="detail-info">
                        <h2>${currentProduct.name}</h2>

                        <h3 style="color:#2563eb;">
                            Rp ${Number(currentProduct.price).toLocaleString('id-ID')}
                        </h3>

                        <p><strong>Stok:</strong> ${currentProduct.stock} unit</p>

                        <p><strong>Deskripsi:</strong></p>
                        <p>${currentProduct.description}</p>

                        <div class="btn-group">
                            <button id="btnAddToCart">
                                🛒 Masukkan Keranjang
                            </button>

                            <button id="btnAddToWishlist">
                                ❤️ Tambah Wishlist
                            </button>
                        </div>
                    </div>
                `;

                document.getElementById("btnAddToCart")
                    .addEventListener("click", addToCart);

                document.getElementById("btnAddToWishlist")
                    .addEventListener("click", addToWishlist);

            } catch (error) {
                console.error(error);
                container.innerHTML = `<p>Gagal memuat detail produk: ${error.message}</p>`;
            }
        }

        function addToCart() {
            if (!auth.currentUser) {
                alert("Silakan login terlebih dahulu untuk berbelanja!");
                window.location.href = "../login.html";
                return;
            }

            let cart = JSON.parse(localStorage.getItem("albimo_cart")) || [];

            const existingItemIndex = cart.findIndex(item => item.id === currentProduct.id);

            if (existingItemIndex > -1) {
                cart[existingItemIndex].quantity += 1;
            } else {
                cart.push({
                    id: currentProduct.id,
                    name: currentProduct.name,
                    price: Number(currentProduct.price),
                    imageUrl: currentProduct.imageUrl,
                    quantity: 1
                });
            }

            localStorage.setItem("albimo_cart", JSON.stringify(cart));
            alert("Produk berhasil dimasukkan ke keranjang!");
        }

        function addToWishlist() {
            let wishlist = JSON.parse(localStorage.getItem("albimo_wishlist")) || [];

            const isExist = wishlist.some(item => item.id === currentProduct.id);

            if (isExist) {
                alert("Produk sudah ada di wishlist.");
                return;
            }

            wishlist.push({
                id: currentProduct.id,
                name: currentProduct.name,
                price: Number(currentProduct.price),
                imageUrl: currentProduct.imageUrl
            });

            localStorage.setItem("albimo_wishlist", JSON.stringify(wishlist));
            alert("Produk berhasil ditambahkan ke wishlist!");
        }

        loadProductDetail();
    </script>
</body>
</html>
