<!-- customer/checkout.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Checkout Pembayaran</title>

    <link rel="stylesheet"
    href="../assets/css/style.css">

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:20px;
        }

        .checkout-container{
            max-width:600px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        .form-group{
            margin-bottom:15px;
        }

        .form-group label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select{
            width:100%;
            padding:10px;
            box-sizing:border-box;
        }

        .order-summary{
            background:#f9f9f9;
            padding:15px;
            margin-bottom:20px;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            font-size:16px;
            cursor:pointer;
            border-radius:6px;
        }

    </style>

</head>

<body>

<div class="checkout-container">

    <h2>Checkout Pembayaran</h2>

    <hr>

    <div class="order-summary">

        <h3>Ringkasan Belanja</h3>

        <p>
            Total Item:
            <span id="summaryItems">0</span>
        </p>

        <h4>
            Total Tagihan:
            <span id="summaryTotal">Rp 0</span>
        </h4>

    </div>

    <form id="checkoutForm">

        <div class="form-group">

            <label>Nomor WhatsApp</label>

            <input
            type="tel"
            id="custPhone"
            required>

        </div>

        <div class="form-group">

            <label>Alamat Lengkap</label>

            <textarea
            id="custAddress"
            rows="4"
            required></textarea>

        </div>

        <div class="form-group">

            <label>Metode Pembayaran</label>

            <select id="payMethod">

                <option value="Transfer Bank">
                    Transfer Bank
                </option>

                <option value="E-Wallet">
                    E-Wallet
                </option>

            </select>

        </div>

<!-- INFORMASI PEMBAYARAN -->
<div class="payment-info"
style="
margin-top:20px;
padding:15px;
background:#f9f9f9;
border-radius:8px;
">

    <h3>Pembayaran QRIS</h3>

    <img
    src="../assets/img/qris.jpg"
    alt="QRIS"
    width="250"
    style="
    display:block;
    margin:auto;
    border-radius:10px;
    ">

    <p style="text-align:center;">
        Silakan scan QRIS untuk pembayaran
    </p>

    <hr>

    <h3>Transfer Bank</h3>

    <p>
        Bank BNI : 2038992622
    </p>

    <p>
        Atas Nama : HAMZA R RENYAAN
    </p>

</div>

<!-- UPLOAD BUKTI -->
<div class="form-group">

    <label>
        Upload Bukti Transfer
    </label>

    <input
    type="file"
    id="paymentProof"
    accept="image/*"
    required>

</div>

        <button type="submit"
        id="btnPlaceOrder">

            Konfirmasi Pesanan

        </button>

    </form>

</div>

<script type="module">

import { auth, db }
from "../firebase/config.js";

import { protectPage }
from "../assets/js/auth-guard.js";

import {
    collection,
    addDoc
}

import {
    uploadImageToCloudinary
}
from "../firebase/cloudinary.js";

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

protectPage(["customer"]);

const cart =
JSON.parse(
localStorage.getItem("albimo_cart")
) || [];

if(cart.length === 0){

    alert("Keranjang kosong");

    window.location.href =
    "cart.html";
}

function loadSummary(){

    let totalItems = 0;
    let grandTotal = 0;

    cart.forEach(item=>{

        totalItems += item.quantity;

        grandTotal +=
        item.price * item.quantity;

    });

    document.getElementById(
        "summaryItems"
    ).innerText = totalItems;

    document.getElementById(
        "summaryTotal"
    ).innerText =
    `Rp ${grandTotal.toLocaleString('id-ID')}`;
}

document.getElementById(
"checkoutForm"
).addEventListener(
"submit",
async(e)=>{

    e.preventDefault();

    const btn =
    document.getElementById(
        "btnPlaceOrder"
    );

    btn.disabled = true;

    btn.innerText =
    "Memproses...";

    try{

        if(!auth.currentUser){

            alert("Silakan login");

            return;
        }
        
const proofFile =
document.getElementById(
    "paymentProof"
).files[0];

let proofUrl = "";

if(proofFile){

    proofUrl =
    await uploadImageToCloudinary(
        proofFile
    );
}

        let grandTotal =
        cart.reduce(
            (sum,item)=>
            sum + (item.price * item.quantity),
            0
        );

        const orderData = {

            customerId:
            auth.currentUser.uid,

            customerEmail:
            auth.currentUser.email,

            shippingDetails:{
                phone:
                document.getElementById(
                    "custPhone"
                ).value,

                address:
                document.getElementById(
                    "custAddress"
                ).value
            },

            items:cart,

            paymentMethod:
            document.getElementById(
                "payMethod"
            ).value,

            totalPayment:
            grandTotal,

            status:"Pending",

            createdAt:
            new Date().toISOString()

        };

        await addDoc(
            collection(db,"orders"),
            orderData
        );

        localStorage.removeItem(
            "albimo_cart"
        );

        alert(
            "Pesanan berhasil dibuat"
        );

        window.location.href =
        "history.html";

    }catch(error){

        console.error(error);

        alert(
            "Gagal checkout: "
            + error.message
        );

        btn.disabled = false;

        btn.innerText =
        "Konfirmasi Pesanan";
    }

});

loadSummary();

</script>

</body>
</html>
