<!-- customer/wishlist.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Keinginan Saya - AlbimoStore-Pro</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .wishlist-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .wishlist-card { border: 1px solid #e2e8f0; padding: 15px; width: 220px; border-radius: 8px; background: #ffffff; text-align: center; }
        .wishlist-card img { max-width: 100%; height: 140px; object-fit: cover; border-radius: 4px; }
        .btn-action { width: 100%; padding: 8px; margin-top: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-cart { background: #28a745; color: white; }
        .btn-remove { background: #ea580c; color: white; }
    </style>
</head>
<body>
    <h2>Daftar Keinginan Anda (Wishlist)</h2>
    <p>Produk impian yang Anda simpan untuk dibeli nanti.</p>
    <a href="../index.html">← Kembali Berbelanja</a>
    <hr>

    <div id="wishlistContainer" class="wishlist-grid">Memuat daftar keinginan...</div>

    <script type="module">
        import { protectPage } from "../assets/js/auth-guard.js";

        // Kunci rute halaman: Hanya akun ber-role 'customer' yang boleh masuk!
        protectPage(["customer"]);

        function loadWishlist() {
            const container = document.getElementById("wishlistContainer");
            // Ambil data wishlist dari localStorage
            const wishlist = JSON.parse(localStorage.getItem("albimo_wishlist")) || [];

            if (wishlist.length === 0) {
                container.innerHTML = "<p>Belum ada produk di daftar keinginan Anda.</p>";
                return;
            }

            container.innerHTML = "";
            wishlist.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "wishlist-card";
                card.innerHTML = `
                    <img src="${item.imageUrl}" alt="${item.name}">
                    <h4>${item.name}</h4>
                    <p style="color: #e44d26; font-weight: bold;">Rp ${item.price.toLocaleString('id-ID')}</p>
                    <button onclick="moveFromWishlistToCart(${index})" class="btn-action btn-cart">🛒 Pindah ke Keranjang</button>
                    <button onclick="removeFromWishlist(${index})" class="btn-action btn-remove">❌ Hapus</button>
                `;
                container.appendChild(card);
            });
        }

        // Fungsi memindahkan barang dari wishlist langsung masuk ke keranjang belanja
        window.moveFromWishlistToCart = (index) => {
            let wishlist = JSON.parse(localStorage.getItem("albimo_wishlist")) || [];
            let cart = JSON.parse(localStorage.getItem("albimo_cart")) || [];

            const targetItem = wishlist[index];

            // Cek apakah produk tersebut sudah ada di dalam keranjang belanja
            const existingIndex = cart.findIndex(item => item.id === targetItem.id);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    id: targetItem.id,
                    name: targetItem.name,
                    price: targetItem.price,
                    imageUrl: targetItem.imageUrl,
                    quantity: 1
                });
            }

            // Hapus dari wishlist setelah dipindah
            wishlist.splice(index, 1);

            // Simpan perubahan ke masing-masing localStorage
            localStorage.setItem("albimo_cart", JSON.stringify(cart));
            localStorage.setItem("albimo_wishlist", JSON.stringify(wishlist));

            alert("Produk berhasil dipindahkan ke keranjang belanja!");
            loadWishlist(); // Segarkan tampilan halaman
        };

        // Fungsi menghapus item dari daftar wishlist secara permanen
        window.removeFromWishlist = (index) => {
            let wishlist = JSON.parse(localStorage.getItem("albimo_wishlist")) || [];
            wishlist.splice(index, 1);
            localStorage.setItem("albimo_wishlist", JSON.stringify(wishlist));
            loadWishlist();
        };

        // Jalankan pemuatan data wishlist saat halaman terbuka
        loadWishlist();
    </script>
</body>
</html>
