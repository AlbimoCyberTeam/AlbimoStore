<!-- customer/orders.html -->
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Riwayat Pesanan Saya</title>

    <link rel="stylesheet"
    href="../assets/css/style.css">

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:20px;
        }

        .order-card{
            background:white;
            border:1px solid #ddd;
            padding:15px;
            margin:15px 0;
            border-radius:8px;
        }

        .status-badge{
            display:inline-block;
            padding:5px 10px;
            border-radius:5px;
            background:#ffeeba;
            color:#856404;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h2>Riwayat Belanja Anda</h2>

<a href="../index.html">
    ← Kembali Belanja
</a>

<hr>

<div id="ordersContainer">
    Memuat riwayat pesanan...
</div>

<script type="module">

import {
    auth,
    db
}
from "../firebase/config.js";

import {
    protectPage
}
from "../assets/js/auth-guard.js";

import {
    collection,
    query,
    where,
    getDocs,
    orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

protectPage(["customer"]);

async function fetchCustomerOrders(userId){

    const container =
    document.getElementById(
        "ordersContainer"
    );

    try{

        const q = query(

            collection(db,"orders"),

            where(
                "customerId",
                "==",
                userId
            ),

            orderBy(
                "createdAt",
                "desc"
            )

        );

        const querySnapshot =
        await getDocs(q);

        if(querySnapshot.empty){

            container.innerHTML =
            "<p>Belum ada transaksi.</p>";

            return;
        }

        container.innerHTML = "";

        querySnapshot.forEach((doc)=>{

            const order = doc.data();

            const orderId = doc.id;

            const card =
            document.createElement("div");

            card.className =
            "order-card";

            card.innerHTML = `

                <h4>
                    ID Pesanan:
                    ${orderId}
                </h4>

                <p>
                    Tanggal:
                    ${new Date(
                        order.createdAt
                    ).toLocaleDateString('id-ID')}
                </p>

                <p>
                    Status:
                    <span class="status-badge">
                        ${order.status}
                    </span>
                </p>

                <p>
                    Total:
                    <strong>
                    Rp ${order.totalPayment.toLocaleString('id-ID')}
                    </strong>
                </p>

                <p>
                    Metode:
                    ${order.paymentMethod}
                </p>

            `;

            container.appendChild(card);

        });

    }catch(error){

        console.error(error);

        container.innerHTML =
        "<p>Gagal memuat riwayat pesanan.</p>";
    }

}

onAuthStateChanged(auth,(user)=>{

    if(user){

        fetchCustomerOrders(
            user.uid
        );

    }else{

        window.location.href =
        "../login.html";
    }

});

</script>

</body>
</html>
