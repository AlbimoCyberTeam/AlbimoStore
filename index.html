<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbimoStore-Pro - Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Style CSS tambahan di bawah ini dihapus karena sudah diatur dengan sangat rapi dan estetik di dalam assets/css/style.css baru kita -->
</head>
<body>

    <!-- Tag <header> lama sudah dihapus dari sini karena initNavbar() akan otomatis menambahkannya ke paling atas halaman -->

    <main>
        <h3>Produk Terbaru</h3>
        <div id="productContainer" class="product-grid">Loading produk...</div>
    </main>

    <!-- SCRIPT 1: Untuk Memuat Katalog Produk -->
    <script type="module">
        import { getAllProducts } from "./firebase/firestore.js";

        async function loadCatalog() {
            const container = document.getElementById("productContainer");
            const products = await getAllProducts();

            if (products.length === 0) {
                container.innerHTML = "<p>Belum ada produk yang dijual.</p>";
                return;
            }

            container.innerHTML = "";
            products.forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <img src="${product.imageUrl}" alt="${product.name}">
                    <h4>${product.name}</h4>
                    <p>Rp ${Number(product.price).toLocaleString('id-ID')}</p>
                    <button onclick="goToDetail('${product.id}')">Lihat Detail</button>
                `;
                container.appendChild(card);
            });
        }

        // Ekspos fungsi navigasi ke window object agar bisa dipanggil lewat onclick HTML
        window.goToDetail = (id) => {
            window.location.href = `customer/product.html?id=${id}`;
        };

        loadCatalog();
    </script>

    <!-- SCRIPT 2: Untuk Memuat Navigasi Pintar (Navbar) Otomatis -->
    <script type="module">
        import { initNavbar } from "./assets/js/navbar.js";
        // Panggil fungsi tanpa argumen karena berada di folder root
        initNavbar();
    </script>
</body>
</html>
