<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="assets/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbimoStore-Pro - Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .product-grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; width: 200px; border-radius: 8px; }
        .product-card img { max-width: 100%; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to AlbimoStore-Pro</h1>
        <nav>
            <a href="login.html">Login</a> | <a href="customer/cart.html">Keranjang🛒</a>
        </nav>
    </header>

    <main>
        <h3>Produk Terbaru</h3>
        <div id="productContainer" class="product-grid">Loading produk...</div>
    </main>

    <script type="module">
        import { getAllProducts } from "./firebase/firestore.js";

        async function loadCatalog() {
            const container = document.getElementById("productContainer");
            const products = await getAllProducts();

            if (products.length === 0) {
                container.innerHTML = "<p>Belum ada produk yang dijual.</p>";
                return;
            }

            container.innerHTML = "";
            products.forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <img src="${product.imageUrl}" alt="${product.name}">
                    <h4>${product.name}</h4>
                    <p>Rp ${Number(product.price).toLocaleString('id-ID')}</p>
                    <button onclick="goToDetail('${product.id}')">Lihat Detail</button>
                `;
                container.appendChild(card);
            });
        }

        // Ekspos fungsi navigasi ke window object agar bisa dipanggil lewat onclick HTML
        window.goToDetail = (id) => {
            window.location.href = `product.html?id=${id}`;
        };

        loadCatalog();
    </script>
</body>
</html>
