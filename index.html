<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Albimo Store | Home</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav>
    <a href="index.html"><h1>Albimo Store</h1></a>
    <div>
      <a href="products.html">Produk</a> | 
      <a href="cart.html">Keranjang (<span id="cart-count">0</span>)</a> | <a href="user/orders.html">Pesanan Saya</a> | 
      <a href="auth/login.html" id="auth-link">Login</a>
    </div>
  <span id="user-info" style="margin-left:10px"></span></nav>

  <h2 style="padding: 2rem 5% 0;">Produk Terbaru</h2>
  <div class="grid" id="latest-products"></div>

  <script type="module">
    import { ref, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { db } from "./firebase/config.js";

    const container = document.getElementById('latest-products');
    
    get(child(ref(db), 'products')).then((snapshot) => {
      if (snapshot.exists()) {
        const products = snapshot.val();
        let html = '';
        for (let id in products) {
          html += `
            <div class="card">
              <img src="${products[id].image}" alt="${products[id].name}">
              <div class="card-body">
                <h3>${products[id].name}</h3>
                <p>Rp ${Number(products[id].price).toLocaleString('id-ID')}</p>
                <a href="product-detail.html?id=${id}" class="btn">Detail</a>
              </div>
            </div>`;
        }
        container.innerHTML = html;
      } else {
        container.innerHTML = '<p>Belum ada produk.</p>';
      }
    });
  </script>

<script type="module">
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth=getAuth();
onAuthStateChanged(auth,(user)=>{
 const el=document.getElementById('user-info');
 if(!el) return;

 if(user){
   const name=user.displayName || user.email || 'User';
   el.innerHTML=`<span>👤 ${name}</span> |
   <a href="#" id="logout-btn">Logout</a>`;

   document.getElementById('logout-btn').onclick=async(e)=>{
      e.preventDefault();
      await signOut(auth);
      location.reload();
   };
 }else{
   el.innerHTML='<a href="login.html">Login</a>';
 }
});
</script>

</body>
</html>
