<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body><div style="text-align:center;padding:10px"><img src="store-logo.svg" style="max-width:120px"></div>
  <div style="max-width: 400px; margin: 80px auto; padding: 20px; background: white; border-radius: 8px;">
    <h2>Reset Password</h2>
    <p style="font-size: 14px; color: grey;">Masukkan email terdaftar Anda untuk menerima link reset.</p>
    <form id="forgot-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="forgot-email" required>
      </div>
      <button type="submit" class="btn" style="width: 100%;">Kirim Link Reset</button>
    </form>
    <p style="text-align: center; margin-top: 15px;"><a href="login.html">Kembali ke Login</a></p>
  </div>

  <script type="module">
    import { sendPasswordResetEmail } from "https://gstatic.com";
    import { auth } from "../firebase/config.js";

    document.getElementById('forgot-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      try {
        await sendPasswordResetEmail(auth, email);
        alert('Email pemulihan kata sandi telah dikirim!');
      } catch (error) {
        alert('Error: ' + error.message);
      }
    };
  </script>
</body>
</html>
