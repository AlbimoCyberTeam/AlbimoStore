<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albimo Store | Masuk</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div style="max-width: 400px; margin: 80px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2>Selamat Datang</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn" style="width: 100%;">Masuk</button>
    </form>
    <div style="margin-top: 15px; display: flex; justify-content: space-between; font-size: 13px;">
      <a href="forgot-password.html">Lupa Password?</a>
      <a href="register.html">Buat Akun Baru</a>
    </div>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword } from "https://gstatic.com";
    import { ref, get } from "https://gstatic.com";
    import { auth, db } from "../firebase/config.js";

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Cek role user di database
        const snapshot = await get(ref(db, 'users/' + user.uid));
        if (snapshot.exists() && snapshot.val().role === 'admin') {
          window.location.href = '../admin/dashboard.html';
        } else {
          window.location.href = '../index.html';
        }
      } catch (error) {
        alert('Gagal Masuk: Email atau Password salah.');
      }
    };
  </script>
</body>
</html>
