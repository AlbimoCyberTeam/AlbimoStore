<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><title>Keranjang Belanja | Albimo Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 py-10">
  <div class="container mx-auto max-w-4xl px-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">Keranjang Belanja Anda</h1>
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <span class="text-slate-600">Total Pembayaran:</span>
        <span class="text-2xl font-bold text-sky-600" id="total-price">Rp 0</span>
      </div>
      <a href="checkout.html" class="block text-center w-full bg-sky-600 text-white font-medium py-3 rounded-xl hover:bg-sky-700 transition shadow-md shadow-sky-100">Lanjut ke Checkout</a>
    </div>
    <script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = e.target.querySelectorAll('input')[0].value;
    const password = e.target.querySelectorAll('input')[1].value;

    // Simulasi Akun Hardcoded untuk Keperluan Testing Fitur Pro
    if (email === "admin@gmail.com" && password === "admin1984") {
      alert("Login Sukses sebagai Administrator Toko.");
      window.location.href = "../admin/dashboard.html";
    } else if (email === "user@gmail.com" && password === "user1984") {
      alert("Login Sukses sebagai Pembeli.");
      window.location.href = "../index.html";
    } else {
      alert("Email atau Kata Sandi Salah! Gunakan akun uji coba (admin@gmail.com / admin1984).");
    }
  });
</script>
</body>
</html>
