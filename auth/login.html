<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albimo Store | Masuk</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background-color: #fdfafb;">
  <div style="max-width: 400px; margin: 80px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(139, 0, 0, 0.08); border-top: 5px solid #8b0000;">
    <h2 style="color: #8b0000; text-align: center; margin-bottom: 25px; font-weight: 700;">Selamat Datang</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn" style="width: 100%; padding: 0.8rem; font-size: 16px;">Masuk</button>
    </form>
    <div style="margin-top: 20px; display: flex; justify-content: space-between; font-size: 13px;">
      <a href="forgot-password.html" style="color: #64748b; text-decoration: none;">Lupa Password?</a>
      <a href="register.html" style="color: #8b0000; text-decoration: none; font-weight: bold;">Buat Akun Baru</a>
    </div>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { auth, db } from "../firebase/config.js";

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const snapshot = await get(ref(db, 'users/' + user.uid));
        if (snapshot.exists() && snapshot.val().role === 'admin') {
          window.location.href = '../admin/dashboard.html';
        } else {
          window.location.href = '../index.html';
        }
      } catch (error) {
        alert('Gagal Masuk: Email atau Password salah.');
      }
    };
  </script>
</body>
</html>
