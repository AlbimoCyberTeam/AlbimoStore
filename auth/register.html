<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albimo Store | Daftar Akun</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div style="max-width: 400px; margin: 60px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2>Daftar Akun Baru</h2>
    <form id="register-form">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="reg-name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" minlength="6" required>
      </div>
      <button type="submit" class="btn" style="width: 100%;">Daftar Sekarang</button>
    </form>
    <p style="margin-top: 15px; text-align: center; font-size: 14px;">
      Sudah punya akun? <a href="login.html">Login di sini</a>
    </p>
  </div>

  <script type="module">
    import { createUserWithEmailAndPassword } from "https://gstatic.com";
    import { ref, set } from "https://gstatic.com";
    import { auth, db } from "../firebase/config.js";

    document.getElementById('register-form').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        
        // Simpan data peran/role user ke Realtime Database
        await set(ref(db, 'users/' + user.uid), {
          name: name,
          email: email,
          role: 'customer',
          createdAt: Date.now()
        });

        alert('Registrasi Berhasil! Silakan masuk.');
        window.location.href = 'login.html';
      } catch (error) {
        alert('Gagal Registrasi: ' + error.message);
      }
    };
  </script>
</body>
</html>
