<!-- admin/dashboard.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AlbimoStore-Pro</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .admin-layout { display: flex; }
        .sidebar { width: 220px; background: #333; color: white; min-height: 100vh; padding: 20px; }
        .sidebar a { color: white; display: block; margin: 15px 0; text-decoration: none; }
        .content { flex: 1; padding: 30px; }
        .stats-grid { display: flex; gap: 20px; margin-top: 20px; }
        .stat-card { background: #f4f4f4; padding: 20px; border-radius: 8px; flex: 1; border-left: 5px solid #007bff; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Menu Navigasi Admin -->
        <aside class="sidebar">
            <h3>Albimo Admin</h3>
            <hr>
            <a href="dashboard.html" style="font-weight: bold; color: #007bff;">📊 Dashboard</a>
            <a href="sellers.html">🏬 Kelola Seller</a>
            <a href="users.html">👥 Kelola Pengguna</a>
            <a href="products.html">📦 Semua Produk</a>
            <a href="orders.html">📜 Riwayat Transaksi</a>
            <hr>
            <a href="#" id="adminLogout" style="color: #ff4d4d;">🚪 Keluar</a>
        </aside>

        <!-- Main Content Area -->
        <main class="content">
            <h2>Ringkasan Platform</h2>
            <p>Selamat datang kembali di panel kendali utama AlbimoStore-Pro.</p>

            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Total Pengguna</h4>
                    <h2 id="totalUsers">-</h2>
                </div>
                <div class="stat-card" style="border-left-color: #28a745;">
                    <h4>Total Produk Aktif</h4>
                    <h2 id="totalProducts">-</h2>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { protectPage } from "../assets/js/auth-guard.js";
        import { logoutUser } from "../firebase/auth.js";
        import { db } from "../firebase/config.js";
        import { collection, getCountFromServer } from "https://gstatic.com";

        // Kunci halaman: Hanya akun ber-role 'admin' yang boleh masuk
        protectPage(["admin"]);

        // Fungsi menghitung total data secara real-time & hemat kuota Firebase (Menggunakan getCountFromServer)
        async function loadStats() {
            try {
                const usersColl = collection(db, "users");
                const userSnapshot = await getCountFromServer(usersColl);
                document.getElementById("totalUsers").innerText = `${userSnapshot.data().count} Pengguna`;

                const productsColl = collection(db, "products");
                const productSnapshot = await getCountFromServer(productsColl);
                document.getElementById("totalProducts").innerText = `${productSnapshot.data().count} Produk`;
            } catch (error) {
                console.error("Gagal memuat statistik:", error);
            }
        }

        // Pasang fungsi logout
        document.getElementById("adminLogout").addEventListener("click", (e) => {
            e.preventDefault();
            if(confirm("Apakah Anda yakin ingin keluar?")) {
                logoutUser();
            }
        });

        loadStats();
    </script>
</body>
</html>
