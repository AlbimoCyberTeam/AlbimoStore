<!-- admin/products.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="assets/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Produk Platform - Admin Panel</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .admin-layout { display: flex; }
        .sidebar { width: 220px; background: #333; color: white; min-height: 100vh; padding: 20px; }
        .sidebar a { color: white; display: block; margin: 15px 0; text-decoration: none; }
        .content { flex: 1; padding: 30px; }
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; text-align: left; }
        th, td { padding: 12px; border: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f4f4f4; font-weight: bold; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Menu Navigasi Admin -->
        <aside class="sidebar">
            <h3>Albimo Admin</h3>
            <hr>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="sellers.html">🏬 Kelola Seller</a>
            <a href="users.html">👥 Kelola Pengguna</a>
            <a href="products.html" style="font-weight: bold; color: #007bff;">📦 Semua Produk</a>
            <a href="orders.html">📜 Riwayat Transaksi</a>
            <hr>
            <a href="#" id="adminLogout" style="color: #ff4d4d;">🚪 Keluar</a>
        </aside>

        <!-- Main Content Area -->
        <main class="content">
            <h2>Katalog Produk Global</h2>
            <p>Monitor dan moderasi seluruh item barang dagangan yang diunggah oleh semua mitra penjual.</p>
            <hr>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nama Produk</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>ID Penjual</th>
                            <th>Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable">
                        <tr>
                            <td colspan="6" style="text-align: center;">Memuat katalog produk global...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { protectPage } from "../assets/js/auth-guard.js";
        import { logoutUser } from "../firebase/auth.js";
        import { db } from "../firebase/config.js";
        import { collection, getDocs, doc, deleteDoc } from "https://gstatic.com";

        // Kunci rute halaman: Hanya akun ber-role 'admin' yang bisa masuk!
        protectPage(["admin"]);

        async function loadAllGlobalProducts() {
            const tbody = document.getElementById("adminProductsTable");
            
            try {
                // Mengambil seluruh produk yang ada di koleksi "products" Firestore
                const querySnapshot = await getDocs(collection(db, "products"));
                
                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Belum ada produk yang diunggah oleh penjual.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                querySnapshot.forEach((productDoc) => {
                    const product = productDoc.data();
                    const productId = productDoc.id;

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><img src="${product.imageUrl}" class="img-preview" alt="${product.name}"></td>
                        <td><strong>${product.name}</strong></td>
                        <td>Rp ${Number(product.price).toLocaleString('id-ID')}</td>
                        <td>${product.stock} unit</td>
                        <td><small><code>${product.sellerId}</code></small></td>
                        <td>
                            <button onclick="deleteProductFromAdmin('${productId}')" class="btn-delete">Hapus Paksa</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error("Gagal memuat katalog produk global:", error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Gagal memuat data dari database Firebase.</td></tr>`;
            }
        }

        // Fungsi moderasi untuk menghapus produk yang menyalahi aturan platform
        window.deleteProductFromAdmin = async (productId) => {
            if (confirm("Apakah Anda yakin ingin MENGHAPUS PAKSA produk ini dari platform? Tindakan ini tidak dapat dibatalkan.")) {
                try {
                    await deleteDoc(doc(db, "products", productId));
                    alert("Produk telah berhasil dihapus dari sistem.");
                    loadAllGlobalProducts(); // Segarkan kembali tabel katalog
                } catch (error) {
                    alert("Gagal menghapus produk: " + error.message);
                }
            }
        };

        // Pasang fungsi logout pada menu sidebar admin
        document.getElementById("adminLogout").addEventListener("click", (e) => {
            e.preventDefault();
            if (confirm("Apakah Anda yakin ingin keluar?")) {
                logoutUser();
            }
        });

        // Jalankan pemanggilan data produk secara otomatis saat halaman terbuka
        loadAllGlobalProducts();
    </script>
</body>
</html>
