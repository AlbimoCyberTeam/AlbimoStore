<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Produk | Admin Albimo</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-100 flex">

  <!-- Sidebar Berwarna Biru Gelap Profesional -->
  <aside class="w-64 bg-slate-900 text-slate-300 min-h-screen p-6 sticky top-0 h-screen">
    <div class="text-white text-xl font-bold tracking-wider mb-10 border-b border-slate-800 pb-4">ALBIMO ADMIN</div>
    <nav class="space-y-2">
      <a href="dashboard.html" class="block px-4 py-3 hover:bg-slate-800 rounded-xl transition">📊 Dashboard</a>
      <a href="products.html" class="block px-4 py-3 bg-sky-700 text-white rounded-xl font-medium">📦 Produk</a>
      <a href="orders.html" class="block px-4 py-3 hover:bg-slate-800 rounded-xl transition">🧾 Pesanan</a>
      <a href="users.html" class="block px-4 py-3 hover:bg-slate-800 rounded-xl transition">👥 Pengguna</a>
    </nav>
  </aside>

  <!-- Panel Konten Utama -->
  <main class="flex-1 p-8 overflow-y-auto">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold text-slate-800">Katalog Produk Admin</h1>
        <p class="text-sm text-slate-500 mt-1">Kelola, tambah, edit, atau hapus item produk dari Albimo Store.</p>
      </div>
      <!-- Tombol Tambah Produk Baru -->
      <a href="add-product.html" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md shadow-sky-100 transition flex items-center gap-2">
        ➕ Tambah Produk
      </a>
    </header>

    <!-- Tabel Data Produk -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 text-slate-400 uppercase text-[11px] font-bold tracking-wider border-b border-slate-100">
            <th class="p-4 pl-6 w-20">Foto</th>
            <th class="p-4">Nama Barang</th>
            <th class="p-4">Kategori</th>
            <th class="p-4">Harga</th>
            <th class="p-4">Stok</th>
            <th class="p-4 pr-6 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="admin-product-table" class="divide-y divide-slate-100 text-slate-700 text-sm">
          <!-- Data Produk di-render Otomatis via JS -->
        </tbody>
      </table>
      <div id="empty-state" class="hidden p-12 text-center text-slate-400">
        <span class="text-4xl block mb-2">📦</span>
        Katalog produk kosong. Silakan tambah produk baru terlebih dahulu.
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderAdminProducts();
    });

    // Fungsi utama merender baris tabel produk
    function renderAdminProducts() {
      const products = JSON.parse(localStorage.getItem('albimo_products')) || [];
      const tableBody = document.getElementById('admin-product-table');
      const emptyState = document.getElementById('empty-state');

      if (products.length === 0) {
        tableBody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      tableBody.innerHTML = '';

      products.forEach(product => {
        tableBody.innerHTML += `
          <tr class="hover:bg-slate-50/50 transition">
            <td class="p-4 pl-6">
              <img src="${product.img}" alt="${product.name}" class="w-12 h-12 object-cover rounded-lg border">
            </td>
            <td class="p-4 font-semibold text-slate-800 max-w-xs truncate">${product.name}</td>
            <td class="p-4">
              <span class="bg-sky-50 text-sky-700 px-2.5 py-1 rounded-md text-xs font-medium">${product.category || 'Umum'}</span>
            </td>
            <td class="p-4 font-medium text-slate-600">${formatRupiah(product.price)}</td>
            <td class="p-4 font-semibold ${product.stock <= 3 ? 'text-amber-600' : 'text-slate-600'}">${product.stock} Pcs</td>
            <td class="p-4 pr-6 text-right space-x-3">
              <!-- Link Edit otomatis membawa parameter ID produk -->
              <a href="edit-product.html?id=${product.id}" class="text-sky-600 hover:text-sky-800 font-semibold transition">
                Edit
              </a>
              <button onclick="deleteProduct(${product.id})" class="text-red-500 hover:text-red-700 font-semibold transition">
                Hapus
              </button>
            </td>
          </tr>
        `;
      });
    }

    // Fungsi menghapus produk dari katalog lokal
    function deleteProduct(id) {
      if (confirm("Apakah Anda yakin ingin menghapus produk ini dari katalog Albimo Store?")) {
        let products = JSON.parse(localStorage.getItem('albimo_products')) || [];
        products = products.filter(p => p.id !== id);
        localStorage.setItem('albimo_products', JSON.stringify(products));
        
        renderAdminProducts(); // Segarkan isi tabel secara instan
      }
    }

    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }
  </script>
</body>
</html>
