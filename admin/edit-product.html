<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Produk | Admin Albimo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 py-12 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
    
    <!-- Header Form -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Edit Produk</h2>
        <p class="text-xs text-slate-400 mt-1">Ubah informasi detail produk katalog Albimo Store.</p>
      </div>
      <a href="products.html" class="text-sm font-medium text-slate-500 hover:text-slate-700 bg-slate-100 px-4 py-2 rounded-xl transition">
        ← Kembali
      </a>
    </div>

    <!-- Alert jika ID produk tidak valid -->
    <div id="error-alert" class="hidden bg-red-50 text-red-700 p-4 rounded-xl mb-6 text-sm font-medium">
      ⚠️ Produk tidak ditemukan! Pastikan Anda masuk ke halaman ini melalui daftar produk admin.
    </div>

    <!-- Form Edit Produk (Tema Biru Pro) -->
    <form id="edit-product-form" class="space-y-5 hidden">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Barang</label>
        <input type="text" id="edit-prod-name" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none border-slate-200">
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Harga (Rp)</label>
          <input type="number" id="edit-prod-price" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none border-slate-200">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Stok</label>
          <input type="number" id="edit-prod-stock" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none border-slate-200">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Kategori</label>
        <input type="text" id="edit-prod-category" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none border-slate-200">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">URL Foto Barang</label>
        <input type="url" id="edit-prod-img" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none border-slate-200">
        <p class="text-[11px] text-slate-400 mt-1">Masukkan tautan gambar langsung (misal dari Cloudinary atau Unsplash).</p>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-sky-600 text-white font-semibold py-3 rounded-xl hover:bg-sky-700 transition shadow-md shadow-sky-100">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>

  <script>
    let productId = null;
    let products = [];

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Ambil ID Produk dari URL (?id=X)
      const urlParams = new URLSearchParams(window.location.search);
      productId = parseInt(urlParams.get('id'));
      
      // 2. Ambil data produk dari LocalStorage
      products = JSON.parse(localStorage.getItem('albimo_products')) || [];
      
      // 3. Cari produk berdasarkan ID
      const targetProduct = products.find(p => p.id === productId);

      if (!targetProduct) {
        document.getElementById('error-alert').classList.remove('hidden');
        return;
      }

      // 4. Jika produk ada, munculkan form dan isi datanya
      document.getElementById('edit-product-form').classList.remove('hidden');
      document.getElementById('edit-prod-name').value = targetProduct.name;
      document.getElementById('edit-prod-price').value = targetProduct.price;
      document.getElementById('edit-prod-stock').value = targetProduct.stock;
      document.getElementById('edit-prod-category').value = targetProduct.category || "Umum";
      document.getElementById('edit-prod-img').value = targetProduct.img;
    });

    // 5. Logika Menyimpan Perubahan Data
    document.getElementById('edit-product-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const productIndex = products.findIndex(p => p.id === productId);

      if (productIndex !== -1) {
        // Update objek data produk dalam array
        products[productIndex].name = document.getElementById('edit-prod-name').value;
        products[productIndex].price = parseInt(document.getElementById('edit-prod-price').value);
        products[productIndex].stock = parseInt(document.getElementById('edit-prod-stock').value);
        products[productIndex].category = document.getElementById('edit-prod-category').value;
        products[productIndex].img = document.getElementById('edit-prod-img').value;

        // Simpan kembali array terbaru ke LocalStorage
        localStorage.setItem('albimo_products', JSON.stringify(products));

        alert("Data Produk Berhasil Diperbarui!");
        window.location.href = "products.html"; // Alihkan kembali ke daftar tabel produk admin
      } else {
        alert("Gagal memperbarui data. Produk tidak terdaftar.");
      }
    });
  </script>
</body>
</html>
