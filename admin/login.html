<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albimo Store | Admin Login</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background-color: #2c0000;"> <!-- Latar belakang merah marun gelap khusus admin -->
  <div style="max-width: 400px; margin: 100px auto; padding: 35px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
    <h2 style="text-align: center; color: #8b0000; margin-bottom: 5px; font-weight: 700;">Admin Gateway</h2>
    <p style="text-align: center; color: #64748b; font-size: 13px; margin-bottom: 25px;">Albimo Store Management</p>
    <form id="admin-login-form">
      <div class="form-group">
        <label>Email Admin</label>
        <input type="email" id="admin-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="admin-password" required>
      </div>
      <button type="submit" class="btn" style="width: 100%; background: #8b0000; padding: 0.8rem;">Otorisasi Masuk</button>
    </form>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { auth, db } from "../firebase/config.js";

    document.getElementById('admin-login-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const snapshot = await get(ref(db, 'users/' + user.uid));
        if (snapshot.exists() && snapshot.val().role === 'admin') {
          alert('Akses Admin Diterima.');
          window.location.href = 'dashboard.html';
        } else {
          alert('Akses Ditolak: Anda bukan administrator.');
          window.location.href = '../index.html';
        }
      } catch (error) {
        alert('Gagal Masuk: Kredensial salah.');
      }
    };
  </script>
</body>
</html>
