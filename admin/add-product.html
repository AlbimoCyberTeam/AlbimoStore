<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><title>Tambah Produk | Albimo Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 py-8 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-md p-8 border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-800 mb-6">Tambah Produk Baru</h2>
    <form id="add-product-form" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Barang</label>
        <input type="text" id="prod-name" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Harga (Rp)</label>
          <input type="number" id="prod-price" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Stok</label>
          <input type="number" id="prod-stock" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Foto Barang</label>
        <input type="file" id="prod-file" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
      </div>
      <button type="submit" class="w-full bg-sky-600 text-white font-semibold py-3 rounded-xl hover:bg-sky-700 transition">Simpan ke Katalog</button>
    </form>
  </div>
  <script>
  document.getElementById('add-product-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('prod-name').value;
    const price = parseInt(document.getElementById('prod-price').value);
    const stock = parseInt(document.getElementById('prod-stock').value);
    
    // Default dummy image jika admin tidak mengunggah file gambar asli
    const defaultImg = "https://unsplash.com"; 

    // Ambil database produk yang ada saat ini
    const products = JSON.parse(localStorage.getItem('albimo_products')) || [];
    
    // Membuat ID baru secara urut otomatis
    const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;

    const newProduct = {
      id: newId,
      name: name,
      price: price,
      category: "Umum",
      stock: stock,
      img: defaultImg
    };

    products.push(newProduct);
    localStorage.setItem('albimo_products', JSON.stringify(products));

    alert("Produk Baru Berhasil Ditambahkan ke Katalog Albimo Store!");
    window.location.href = "../products.html"; // Redirect kembali langsung ke halaman katalog produk
  });
</script>
</body>
</html>
