<!-- stores.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Toko - AlbimoStore-Pro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Tag internal .store-card, .store-name, dll dihapus dari sini karena tampilannya sudah otomatis diatur super cantik & rapi oleh assets/css/style.css baru kita -->
</head>
<body>

    <!-- Tag <header> lama dihapus dari sini agar menunya tidak ganda. initNavbar() otomatis membuatkan menu atas pintar untuk Anda -->

    <main>
        <h3>Direktori Toko Mitra</h3>
        <div id="storesContainer" class="stores-grid">Memuat daftar toko mitra...</div>
    </main>

    <!-- SCRIPT 1: Memuat Data Toko dari Firestore -->
    <script type="module">
        import { db } from "./firebase/config.js";
        // URL di bawah ini diperbaiki agar mengarah ke SDK Firebase resmi yang benar
        import { collection, query, where, getDocs } from "https://gstatic.com";

        async function loadPublicStores() {
            const container = document.getElementById("storesContainer");

            try {
                // Mencari semua pengguna di Firestore yang memiliki peran (role) sebagai 'seller'
                const q = query(collection(db, "users"), where("role", "==", "seller"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = "<p>Saat ini belum ada toko mitra yang terdaftar.</p>";
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const sellerData = doc.data();
                    
                    // Ambil detail toko jika sudah diatur oleh seller di panel mereka
                    const store = sellerData.storeDetails || {};
                    const name = store.name || sellerData.fullName || "Toko Tanpa Nama";
                    const slogan = store.slogan || "Selamat datang di toko kami!";
                    const description = store.description || "Penjual belum menambahkan deskripsi toko.";

                    // Membuat elemen kartu toko
                    const card = document.createElement("div");
                    card.className = "store-card";
                    card.innerHTML = `
                        <h3 class="store-name">${name}</h3>
                        <p class="store-slogan">"${slogan}"</p>
                        <p class="store-desc">${description}</p>
                        <a href="index.html?seller=${doc.id}" class="btn-visit">Kunjungi Toko →</a>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Gagal memuat direktori toko:", error);
                container.innerHTML = "<p style='color: red;'>Gagal memuat data toko dari server.</p>";
            }
        }

        // Jalankan fungsi secara otomatis saat halaman dibuka oleh pengunjung
        loadPublicStores();
    </script>

    <!-- SCRIPT 2: Memuat Navigasi Pintar (Navbar) Otomatis -->
    <script type="module">
        import { initNavbar } from "./assets/js/navbar.js";
        initNavbar();
    </script>
</body>
</html>
