<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Detail Produk</title></head><body><div id="detail-container"></div><script type="module">
import { ref,get,child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { db } from "./firebase/config.js";
const productId=new URLSearchParams(location.search).get("id");
if(productId){
 const snap=await get(child(ref(db),`products/${productId}`));
 if(snap.exists()){
   const p=snap.val();
   document.getElementById("detail-container").innerHTML=`<h2>${p.name}</h2><p>${p.description}</p>`;
 } else {
   document.getElementById("detail-container").textContent="Produk tidak ditemukan.";
 }
}
</script></body></html>
