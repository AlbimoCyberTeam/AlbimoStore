<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detail Produk</title>
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div style="padding:20px" id="detail-container"></div>
<script type="module">
import { ref,get,child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { db } from "./firebase/config.js";

const id=new URLSearchParams(location.search).get("id");
const box=document.getElementById("detail-container");

if(id){
 const snap=await get(child(ref(db),"products/"+id));
 if(snap.exists()){
   const p=snap.val();
   box.innerHTML=`
   <h2>${p.name||"Produk"}</h2>
   <p>${p.description||""}</p>
   <h3>Rp ${Number(p.price||0).toLocaleString("id-ID")}</h3>
   <button id="addCart">Tambah ke Keranjang</button>
   <button id="buyNow">Beli Sekarang</button>
   `;

   document.getElementById("addCart").onclick=()=>{
      const cart=JSON.parse(localStorage.getItem("cart")||"[]");
      cart.push({id:id,name:p.name,price:p.price||0});
      localStorage.setItem("cart",JSON.stringify(cart));
      alert("Produk berhasil ditambahkan ke keranjang");
   };

   document.getElementById("buyNow").onclick=()=>{
      localStorage.setItem("cart",JSON.stringify([{id:id,name:p.name,price:p.price||0}]));
      location.href="cart.html";
   };
 } else {
   box.innerHTML="Produk tidak ditemukan";
 }
}
</script></body></html>
