<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Produk</title></head><body><table><tbody id="admin-products-table"></tbody></table><script type="module">
import { ref,get,remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { db } from "../firebase/config.js";
const tbody=document.getElementById("admin-products-table");
async function loadAdminProducts(){
 try{
  const snap=await get(ref(db,"products"));
  if(!snap.exists()){tbody.innerHTML='<tr><td>Belum ada produk</td></tr>';return;}
  let html='';
  const products=snap.val();
  for(const id in products){html+=`<tr><td>${products[id].name}</td><td><button class="btn-delete" data-id="${id}">Hapus</button></td></tr>`;}
  tbody.innerHTML=html;
  document.querySelectorAll(".btn-delete").forEach(btn=>btn.onclick=async()=>{await remove(ref(db,`products/${btn.dataset.id}`));loadAdminProducts();});
 }catch(e){console.error(e);}
}
loadAdminProducts();
</script></body></html>
