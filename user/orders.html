<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Pesanan Saya</title></head>
<body><div style="text-align:center;padding:10px"><img src="store-logo.svg" style="max-width:120px"></div><h2>Pesanan Saya</h2><div id="orders"></div>
<script type="module">
import { auth, db } from '../firebase/config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { ref,get,update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const box=document.getElementById('orders');

onAuthStateChanged(auth, async(user)=>{
if(!user){ box.innerHTML='Silakan login'; return; }
const snap=await get(ref(db,'orders'));
let html='';
if(snap.exists()){
Object.entries(snap.val()).forEach(([id,o])=>{
if(o.userId!==user.uid) return;
html+=`<div style="border:1px solid #ccc;padding:10px;margin:10px">
<b>ID:</b> ${id}<br>
<b>Total:</b> Rp ${o.total||0}<br>
<b>Status:</b> ${o.status}<br>
${o.status==='Pending'?`<button onclick="cancelOrder('${id}')">Batalkan Pesanan</button>`:''}
</div>`;
});
}
box.innerHTML=html;
window.cancelOrder=async(id)=>{
await update(ref(db,'orders/'+id),{status:'Dibatalkan'});
location.reload();
}
});
</script></body></html>
